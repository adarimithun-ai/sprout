name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── 1. Build signed APK ──────────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore from secret (if set)
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > apk-build/android.keystore
            echo "Using keystore from secret."
          else
            echo "KEYSTORE_BASE64 secret not set — using committed keystore (password: android)."
          fi

      - name: Make gradlew executable
        run: chmod +x apk-build/gradlew

      - name: Build release APK
        working-directory: apk-build
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/apk-build/android.keystore
          KEYSTORE_PASSWORD: sprout2024
          KEY_ALIAS: android
          KEY_PASSWORD: sprout2024
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate built APK
        id: find_apk
        run: |
          APK=$(find apk-build/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          cp "$APK" sprout-v4.apk
          echo "APK ready: $APK"

      - name: Extract certificate SHA-256 fingerprint
        id: fingerprint
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          SHA256=$($ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify \
            --print-certs sprout-v4.apk \
            | grep "Signer #1 certificate SHA-256 digest" | awk '{print $NF}' \
            | sed 's/../&:/g;s/:$//')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Certificate SHA-256 fingerprint: $SHA256"

      - name: Write assetlinks.json for Vercel TWA verification
        run: |
          mkdir -p .well-known
          cat > .well-known/assetlinks.json << EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "io.github.adarimithun_ai.sprout",
              "sha256_cert_fingerprints": ["${{ steps.fingerprint.outputs.sha256 }}"]
            }
          }]
          EOF
          echo "assetlinks.json written:"
          cat .well-known/assetlinks.json

      - name: Deploy assetlinks.json to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npm install -g vercel@latest --silent
            vercel deploy --prod --token "$VERCEL_TOKEN" --yes 2>&1 | tail -5
          else
            echo "VERCEL_TOKEN not set — skipping Vercel deploy. Commit assetlinks.json manually."
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprout-v4-apk
          path: sprout-v4.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.${{ github.run_number }}
          name: "Sprout v4 — Polish update"
          body: |
            ## What's new in v4

            ### Quick wins & polish
            - ✏️ **Edit entries** — growth records, milestone/health notes, memory captions
            - 🎂 **Exact age** — stat card now shows "4 months, 12 days" when DOB is set
            - ☀️ **Light / dark mode** toggle in the header (preference saved)
            - 🌱 **Onboarding wizard** — 3-step setup on first launch (name, DOB, parent name)

            ### Previous highlights
            - Growth percentile chart vs WHO benchmarks
            - Head circumference tracking
            - IAP vaccination schedule with due-date alerts
            - Export / Import JSON backup
            - Milestone confetti animation
            - Month-by-month suggestions (food, milestones, memory ideas)

            🌐 **Web app:** https://sprout-baby-tracker.vercel.app

            ---
            **How to install the APK:**
            1. Download `sprout-v4.apk` below
            2. Transfer to your Android phone
            3. Enable **Install from unknown sources** in Settings → Security
            4. Tap the file to install
          files: sprout-v4.apk
          draft: false
          prerelease: false
